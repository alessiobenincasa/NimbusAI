apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-chatbot-api
  namespace: app
  labels:
    app: llm-chatbot
    component: api
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: llm-chatbot
      component: api
  template:
    metadata:
      labels:
        app: llm-chatbot
        component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: api
        image: localhost:5000/llm-chatbot-api:${VERSION}
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: database-credentials
              key: url
        - name: LLM_SERVICE_URL
          value: "http://llm-chatbot-llm:8001"
        - name: LOG_LEVEL
          value: "info"
        - name: ENVIRONMENT
          value: "production"
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: llm-chatbot-api
  namespace: app
  labels:
    app: llm-chatbot
    component: api
spec:
  selector:
    app: llm-chatbot
    component: api
  ports:
  - port: 80
    targetPort: 8000
    name: http
  type: ClusterIP 