apiVersion: v1
kind: ConfigMap
metadata:
  name: filebeat-config
  namespace: monitoring
data:
  filebeat.yml: |
    filebeat.inputs:
    - type: container
      paths:
        - /var/log/containers/*.log
    
    logging.json: true
    logging.metrics.enabled: false
    
    output.elasticsearch:
      hosts: ["llm-chatbot-elasticsearch:9200"]
    
    processors:
      - add_kubernetes_metadata:
          host: ${NODE_NAME}
          matchers:
          - logs_path:
              logs_path: "/var/log/containers/"
      - add_docker_metadata:
          host: "unix:///var/run/docker.sock"
      - add_cloud_metadata: ~
      - add_host_metadata: ~ 