version: '3'

services:
  gitlab:
    image: gitlab/gitlab-ce:latest
    container_name: gitlab-test
    restart: always
    hostname: 'gitlab.example.com'
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://gitlab.example.com'
        gitlab_rails['initial_root_password'] = 'Abcd1234!@#$'
        gitlab_rails['display_initial_root_password'] = true
    ports:
      - '8080:80'
      - '8443:443'
      - '8022:22'
    volumes:
      - 'gitlab-config-test:/etc/gitlab'
      - 'gitlab-logs-test:/var/log/gitlab'
      - 'gitlab-data-test:/var/opt/gitlab'
    shm_size: '256m'

volumes:
  gitlab-config-test:
  gitlab-logs-test:
  gitlab-data-test: 